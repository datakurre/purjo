stages:
  - test
  - build
  - deploy

variables:
  REGISTRY: ghcr.io
  IMAGE_NAME: datakurre/purjo/purjo
  DEVENV_OPTIONS: --nix-option extra-sandbox-paths $HOME/.netrc
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fastest"

.setup_devenv: &setup_devenv
  before_script:
    - apt-get update && apt-get install -y curl jq git
    - curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | sh -s -- install linux --init none --no-wait
    - . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
    - nix profile install --accept-flake-config github:cachix/devenv/latest
    - nix-shell -p cachix --run "cachix use -d datakurre"

# Test job: static analysis and unit tests
test:
  <<: *setup_devenv
  stage: test
  image: ubuntu:latest
  script:
    - devenv shell -- make check
    - devenv shell -- make test-pytest
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
      - coverage.xml
      - .coverage
    expire_in: 30 days
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  only:
    - merge_requests
    - main

# Build and deploy documentation
docs:
  <<: *setup_devenv
  stage: build
  image: ubuntu:latest
  script:
    - devenv shell -- make build-docs
    - touch docs/_build/html/.nojekyll
  artifacts:
    paths:
      - docs/_build/html/
    expire_in: 30 days
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  only:
    - main

pages:
  stage: deploy
  image: ubuntu:latest
  dependencies:
    - docs
  script:
    - mkdir -p public
    - cp -r docs/_build/html/* public/
  artifacts:
    paths:
      - public
  only:
    - main

# Build and push container image
container:
  <<: *setup_devenv
  stage: build
  image: ubuntu:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "unix:///var/run/docker.sock"
  script:
    # Install podman
    - apt-get install -y podman
    
    # Configure podman credentials if GHCR_TOKEN is set
    - |
      if [ -n "$GHCR_TOKEN" ]; then
        echo "$GHCR_TOKEN" | podman login -u $CI_PROJECT_USERNAME --password-stdin $REGISTRY
      fi
    
    # Build the container
    - devenv shell -- make container-dist
    
    # Determine tags based on ref type
    - |
      if [[ "$CI_COMMIT_TAG" != "" ]]; then
        TAGS="$REGISTRY/$IMAGE_NAME:$CI_COMMIT_TAG"
        TAGS="$TAGS,$REGISTRY/$IMAGE_NAME:latest"
      else
        TAGS="$REGISTRY/$IMAGE_NAME:latest"
        TAGS="$TAGS,$REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
      fi
    
    # Push the image with all tags
    - |
      IFS=',' read -ra TAG_ARRAY <<< "$TAGS"
      for TAG in "${TAG_ARRAY[@]}"; do
        echo "Tagging and pushing: $TAG"
        podman tag localhost/$IMAGE_NAME:latest "$TAG"
        podman push "$TAG"
      done
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  only:
    - main
    - tags
  except:
    - merge_requests
