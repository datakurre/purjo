[project]
name = "purjo"
version = "1.0rc2"
description = "UV based Robot Framework external service task runner for Operaton"
readme = "README.md"
authors = [
    {name = "Asko Soukka", email = "asko.soukka@iki.fi"},
]
maintainers = [
    {name = "Asko Soukka", email = "asko.soukka@iki.fi"},
]
# SPDX expression (PEP 639). It replaces the "License ::" classifier, which
# may not be combined with it.
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "robotframework",
    "operaton",
    "bpmn",
    "bpm",
    "external-task",
    "rpa",
    "automation",
    "uv",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: Robot Framework",
  "Framework :: Robot Framework :: Tool",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
requires-python = ">= 3.10"
dependencies =[
    "hvac>=2.4.0",
    "javaobj-py3>=0.4.4",
    "operaton-tasks>=1.0b3",
    "pathspec>=1.0.3",
    "typer>=0.21.1",
    "tzlocal>=5.3.1",
]

[project.urls]
Homepage = "https://github.com/datakurre/purjo"
Documentation = "https://datakurre.github.io/purjo/"
Repository = "https://github.com/datakurre/purjo"
Issues = "https://github.com/datakurre/purjo/issues"
Changelog = "https://github.com/datakurre/purjo/blob/main/CHANGELOG.md"

[project.scripts]
pur = "purjo.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/purjo"]

# Without this hatchling ships every file git tracks: the e2e fixtures,
# examples, CI config, the nix environment and uv.lock. pyproject.toml,
# PKG-INFO and .gitignore are added by hatchling itself.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/purjo",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

# Releases are uploaded by .github/workflows/release.yml through PyPI trusted
# publishing when the release tag is pushed. This makes "no" the default answer
# to zest.releaser's upload prompt; it still tags and pushes.
[tool.zest-releaser]
release = false

[dependency-groups]
dev = [
    "black>=26.1.0",
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "linkify-it-py>=2.0.3",
    "mypy>=1.19.1",
    "myst-parser>=4.0.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "robotframework>=7.5",
    "robotframework-robocop>=7.2.0",
    "sphinx>=8.1.3",
    "sphinx-autobuild>=2024.10.3",
    "types-hvac>=2.4.0.20251115",
    "zest-releaser>=9.8.0",
]

[tool.isort]
profile = "black"
force_alphabetical_sort_within_sections = true
force_single_line = true
from_first = true
line_length = 200
lines_between_types = 0
no_sections = true

[tool.mypy]
exclude = "src/purjo/data"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "e2e: requires live devenv services (Operaton, Vault, Keycloak) -- run via `make test-e2e`, not the default suite",
    "auth_basic: e2e test that runs under the devenv `basic` profile (engine on HTTP Basic)",
    "auth_oauth2: e2e test that runs under the devenv `shell` profile (engine on OAuth2 + Keycloak)",
]
addopts = [
    "-m", "not e2e",
    "--cov=src/purjo",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=json",
    "--cov-fail-under=100",
    "-v",
]

[tool.coverage.report]
# Structural exclusions: code that exists to satisfy the type system or to
# fail loudly, and that carries no behaviour worth asserting.
exclude_also = [
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
