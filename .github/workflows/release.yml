name: Publish to PyPI
on:
  push:
    # Release tags are bare versions as zest.releaser creates them (1.0rc1),
    # not v-prefixed.
    tags:
      - "[0-9]+.[0-9]+*"
  # A manual run builds and checks the distributions without publishing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv alone, not the devenv shell the other workflows use: building needs
      # only hatchling, and what produces the published files should run as
      # little else as possible. No cache for the same reason.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Check that the tag matches the project version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv version --short)
          if [ "$TAG" != "$version" ]; then
            echo "::error::Tag $TAG does not match project version $version"
            exit 1
          fi

      # Builds the sdist, then the wheel from that sdist, so an sdist that is
      # missing package files fails here.
      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution contents
        run: python3 scripts/check-dist.py dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    # Not ref_type alone: a manual run started from a tag ref is still the
    # build-only dry run.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Must match the environment named in the trusted publisher on PyPI. The
    # OIDC token is only minted for this job, which runs no project code.
    environment:
      name: pypi
      url: https://pypi.org/project/purjo/${{ github.ref_name }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
