name: Build and Publish Container
on:
  push:
    branches:
      - main
    # Release tags are bare versions as zest.releaser creates them (1.0rc1),
    # not v-prefixed; the old v*.*.* filter matched none of them.
    tags:
      - "[0-9]+.[0-9]+*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: datakurre/purjo/purjo

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Publish Container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # release-container.mk uses git describe to populate tag metadata
          # in Labels.json, so fetch tags as well as the commit.
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Configure Cachix
        uses: cachix/cachix-action@v16
        with:
          name: datakurre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install devenv
        run: nix profile add nixpkgs#devenv
        shell: bash

      - name: Set up container registry credentials
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Via stdin, not -p: an argv password is readable from /proc by any
          # other process on the runner for as long as the login runs.
          printenv REGISTRY_PASSWORD \
            | devenv shell -- skopeo login \
                --authfile "$RUNNER_TEMP/containers-auth.json" \
                -u "$GITHUB_ACTOR" --password-stdin "$REGISTRY"

      # Reads the ref from the environment, never through a workflow
      # expression: a tag name is attacker-chosen text, and an expression is
      # pasted into the script before bash parses it.
      - name: Determine container tags
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Only the version. A release pushes main and the tag together, so
            # two runs race; `latest` stays with main rather than going to
            # whichever of them finishes last.
            TAGS="${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAGS="${REGISTRY}/${IMAGE_NAME}:latest"
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${SHORT_SHA}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: devenv shell -- make container-dist

      - name: Push container image tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IFS=',' read -ra TAGS <<< "$IMAGE_TAGS"
          archive=$(mktemp "$RUNNER_TEMP/image-archive.XXXXXX")
          trap 'rm -f "$archive"' EXIT
          ./result > "$archive"

          for TAG in "${TAGS[@]}"; do
            devenv shell -- skopeo copy \
              --authfile "$RUNNER_TEMP/containers-auth.json" \
              "docker-archive:${archive}" "docker://${TAG}"
          done
