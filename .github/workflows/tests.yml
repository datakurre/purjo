name: Tests and Coverage
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run static analysis checks
        run: devenv shell -- make check

      - name: Run tests with coverage
        run: devenv shell -- python -m pytest --cov-report=xml

      - name: Run e2e tests against live services
        run: devenv shell -- devenv test --no-tui

      - name: Report coverage in job summary
        if: always()
        run: |
          {
            echo "## Test coverage"
            echo
            echo '```'
            devenv shell -- python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.xml
            coverage.json
          retention-days: 30
