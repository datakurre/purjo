name: Tests and Coverage
on:
  push:
    branches:
      - main
  # Deliberately unfiltered. `pull_request` filters on the *base* branch, so
  # `branches: [main]` gave zero CI to any PR targeting a feature branch --
  # silently, with no skipped check to notice. A PR stacked on another branch
  # is exactly where the tests are wanted.
  pull_request:
permissions:
  contents: read

# A push to a PR branch supersedes the run already in flight for it; without
# this they both run to completion and queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    # Without this a hung process takes GitHub's 6 hour default with it.
    # 60 rather than 45 because a cold runner currently spends up to ~40 min
    # in a single slow NAR fetch (see the cachix note below), which left no
    # room for the e2e step underneath a 45 min cap.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run static analysis checks
        run: devenv shell -- make check

      - name: Run tests with coverage
        run: devenv shell -- python -m pytest --cov-report=xml

      # `devenv test` waits for every process to become ready before it
      # runs enterTest, so a service that never signals ready stalls here
      # with no output rather than failing.
      - name: Run e2e tests against live services
        timeout-minutes: 15
        run: devenv shell -- devenv test --no-tui

      - name: Report coverage in job summary
        if: always()
        run: |
          {
            echo "## Test coverage"
            echo
            echo '```'
            devenv shell -- python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.xml
            coverage.json
          retention-days: 30
