name: Tests and Coverage
on:
  push:
    branches:
      - main
  # Deliberately unfiltered. `pull_request` filters on the *base* branch, so
  # `branches: [main]` gave zero CI to any PR targeting a feature branch --
  # silently, with no skipped check to notice. A PR stacked on another branch
  # is exactly where the tests are wanted.
  pull_request:
permissions:
  contents: read

# A push to a PR branch supersedes the run already in flight for it; without
# this they both run to completion and queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    # Without this a hung process takes GitHub's 6 hour default with it.
    # 60 rather than 45 because a cold runner currently spends up to ~40 min
    # in a single slow NAR fetch (see the cachix note below), which left no
    # room for the e2e step underneath a 45 min cap.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run static analysis checks
        run: devenv shell -- make check

      - name: Run tests with coverage
        run: devenv shell -- python -m pytest --cov-report=xml

      # Deliberately not `devenv test`. It does not run enterTest until every
      # process reports ready, and mockoon and keycloak-realm-export-all ship
      # no readiness probe, so that wait never finishes: three runs sat here
      # for 15-26 min with every probed service up and no make/pytest ever
      # spawned. Start the services directly and let `make test-e2e-ci` do its
      # own bounded waiting -- which also fails loudly on a service that never
      # appears, instead of letting require_live_services skip the suite green.
      # This duplicates nothing: enterTest's `make test` is already covered by
      # the two steps above.
      - name: Run e2e tests against live services
        timeout-minutes: 15
        run: |
          # The engine is OAuth2-protected (services.operaton.oauth2 in
          # devenv.nix), and the client credentials live in .env.example,
          # matching the committed Keycloak realm fixture. .env is gitignored
          # and devenv's dotenv loader reads it on shell entry, so CI has to
          # materialise it: without it every `pur run` gets 401 and the oauth2
          # test errors on an unset OAUTH2_CLIENT_SECRET. Written here rather
          # than at job level so it cannot perturb the unit-test steps above.
          cp .env.example .env
          # `devenv processes up` in the foreground, backgrounded here, rather
          # than `up -d`: the daemon that -d relies on never signals ready on
          # this runner -- "Daemon failed to start within 120s" -- even though
          # every service does come up (they are all in the job's orphan list
          # at cleanup). That daemon is the most likely reason `devenv test`
          # hung too: it waits on the same thing, just without the 120s bound.
          devenv shell -- devenv processes up > processes.log 2>&1 &
          processes_pid=$!
          status=0
          devenv shell -- make test-e2e-ci || status=$?
          kill "$processes_pid" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "::group::devenv processes output"
            tail -n 200 processes.log || true
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Report coverage in job summary
        if: always()
        run: |
          {
            echo "## Test coverage"
            echo
            echo '```'
            devenv shell -- python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.xml
            coverage.json
          retention-days: 30
