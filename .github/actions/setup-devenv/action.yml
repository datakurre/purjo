name: Setup devenv
description: Install Nix, devenv, and configure cachix
inputs:
  cachix-auth-token:
    description: Cachix authentication token for caching Nix derivations
    required: true

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    # An empty authToken leaves this action in its read-only mode, which logs
    # "Cachix: push -- Pushing is disabled" in the post step and silently keeps
    # the cache empty, so every run rebuilds the whole shell from source. With
    # the token set it uploads the paths the job realised, and the next run
    # substitutes them instead.
    #
    # Known cost, measured on run #8: populating the cache also makes nix fetch
    # big closures from here rather than cache.nixos.org, and one of them is
    # very slow -- keycloak-26.6.3 took 2431s (~100 KB/s) for a single NAR,
    # which was the whole of that run's 42 min "static analysis" step (only 18
    # paths were actually built). That is why the job cap is 60 min. It may be
    # a cold-storage first fetch that warms up; if it persists, the fix is a
    # pushFilter here so large upstream-available closures are not served from
    # this cache at all.
    - name: Configure Cachix
      uses: cachix/cachix-action@v16
      with:
        name: datakurre
        authToken: ${{ inputs.cachix-auth-token }}

    - name: Install devenv
      run: nix profile install --accept-flake-config github:cachix/devenv/latest
      shell: bash
