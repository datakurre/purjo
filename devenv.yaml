inputs:
  devenv-module-devcontainer:
    url: github:datakurre/devenv-module-devcontainer
    flake: false
  devenv-module-devcontainer-nixpkgs:
    url: github:nixos/nixpkgs/nixos-unstable
  devenv-module-operaton:
    url: gitlab:vasara-bpm/devenv-module-operaton/oauth2
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:nixos/nixpkgs/nixos-26.05
  treefmt-nix:
    url: github:numtide/treefmt-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
allow_unfree: true
imports:
- devenv-module-operaton/module.nix
- devenv-module-devcontainer
profile: shell
