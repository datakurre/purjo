inputs:
  devenv-module-devcontainer:
    url: github:datakurre/devenv-module-devcontainer
    flake: false
  devenv-module-devcontainer-nixpkgs:
    url: github:nixos/nixpkgs/nixos-unstable
  devenv-module-operaton:
    url: gitlab:vasara-bpm/devenv-module-operaton
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:nixos/nixpkgs/nixos-25.11
  # Note: following our nixpkgs costs the prebuilt interpreter on
  # nixpkgs-python.cachix.org (it is built against nixpkgs-python's own pinned
  # nixpkgs), so `languages.python.version` below is a CPython build from
  # source on a cold runner. Dropping this `follows` is the real fix, but ONLY
  # together with a regenerated devenv.lock: without one, devenv finds
  # devenv.yaml and the lock inconsistent and re-resolves on every single
  # invocation, downloading a second full nixpkgs closure each time. That took
  # `make check` from 12 min to 44 min and hung even `coverage report`.
  # To do it properly: `devenv update nixpkgs-python` and commit the lock.
  nixpkgs-python:
    url: github:cachix/nixpkgs-python
    inputs:
      nixpkgs:
        follows: nixpkgs
allow_unfree: true
imports:
- devenv-module-operaton/module.nix
- devenv-module-devcontainer
profile: shell
