[project]
name = "e2e-secrets-example"
version = "0.1.0"
description = "e2e fixture: proves secrets reach a task without leaking to logs"
requires-python = ">=3.12"
dependencies = [
    "robotframework>=7.4.1",
]

[tool.purjo.secrets.default]
provider = "file"
path = "secrets.json"

[tool.purjo.topics."My Topic in BPMN"]
name = "Use Secret"
on-fail = "ERROR"
